<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Simulador de sala de máquinas</title>
  <meta name="description" content="Simulador de sala de máquinas de un buque: planta eléctrica, motor principal, sistemas auxiliares, alarmas y prácticas evaluadas, en inglés y español.">
  <meta name="theme-color" content="#0b2239">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="sim.css">
  <link rel="stylesheet" href="er.css">
  <link rel="stylesheet" href="er-a.css">
  <script>
    try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('proa:v1') || '{}').settings?.theme || 'dark'; }
    catch { document.documentElement.dataset.theme = 'dark'; }
  </script>
</head>
<body class="er-body">
  <header class="topbar">
    <div class="brand">⚙️ <strong>ER Simulator</strong> <span>Simulador de sala de máquinas</span></div>
    <div class="topbar-right"><a class="pill off" href="./">EXIT · Salir</a><button id="theme-btn" class="theme-btn" type="button" aria-label="Cambiar tema"></button></div>
  </header>
  <div id="er"></div>
  <script type="module">
    import { store } from './js/core/store.js';
    import { start } from './js/er/ui/app.js';
    const THEMES = { dark: '🌙', light: '☀️', auto: '🌗' };
    const apply = () => {
      const t = store.get().settings.theme || 'dark';
      document.documentElement.dataset.theme = t;
      document.getElementById('theme-btn').textContent = THEMES[t];
    };
    document.getElementById('theme-btn').addEventListener('click', () => {
      const order = ['dark', 'light', 'auto'];
      store.update((s) => { s.settings.theme = order[(order.indexOf(s.settings.theme) + 1) % order.length]; });
    });
    window.addEventListener('proa:store', apply);
    apply();
    start();
  </script>
</body>
</html>
